<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuwentuhan — Taglish Tutor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" aria-hidden="true"></div>
<div class="page-loader" id="page-loader" aria-label="Loading">
  <div class="loader-content">
    <div class="loader-orb-wrap">
      <div class="loader-ring loader-ring-outer"></div>
      <div class="loader-ring loader-ring-inner"></div>
      <div class="loader-core">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/>
        </svg>
      </div>
    </div>
    <div class="loader-brand">
      <h2 class="loader-title">KUWENTUHAN</h2>
      <div class="loader-subtitle">Taglish Tutor • English &amp; Filipino Practice</div>
    </div>
    <div class="loader-progress-wrap">
      <div class="loader-progress-track" aria-hidden="true">
        <div class="loader-progress-bar" id="load-bar"></div>
      </div>
      <div class="loader-progress-info">
        <span class="loader-status" id="load-status">Preparing Taglish tutor session...</span>
        <span class="loader-pct" id="load-pct">0%</span>
      </div>
    </div>
  </div>
</div>
<div class="app">
  <header>
    <div class="brand">
      <div class="orb" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/>
        </svg>
      </div>
      <div class="title-wrap">
        <h1>Kuwentuhan <span class="badge">Taglish Tutor</span></h1>
        <div class="status"><span class="status-dot"></span>Practice English &amp; Filipino with gentle corrections</div>
      </div>
    </div>
    <button class="new" id="new" type="button" title="Start a fresh session">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      New Chat
    </button>
  </header>

  <div id="log" aria-live="polite"></div>

  <div class="composer">
    <div class="sug-wrap" id="sug-wrap" aria-label="Quick topic suggestions">
      <div class="sug-head">
        <span class="sug-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </span>
        <span class="sug-title">Try a topic:</span>
      </div>
      <div class="sug-carousel">
        <button type="button" class="sug-nav-btn prev" id="sug-prev" aria-label="Scroll topics left" title="Scroll left">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="sug-list" id="sug-list" role="group">
          <button type="button" class="sug-btn primary" data-prompt="Teach me the basics of Tagalog and English">✨ Teach me basics</button>
          <button type="button" class="sug-btn" data-prompt="Let’s do a quick mini-class with grammar refresher and exercise">📚 Mini-class lesson</button>
          <button type="button" class="sug-btn" data-prompt="Teach me basic Tagalog conversation and greetings">🇵🇭 Tagalog basics</button>
          <button type="button" class="sug-btn" data-prompt="Help me practice basic English speaking and grammar">🇬🇧 English basics</button>
          <button type="button" class="sug-btn" data-prompt="Explain the difference between Hindi, Ayaw, and Huwag">💡 Hindi vs. Ayaw vs. Huwag</button>
          <button type="button" class="sug-btn" data-prompt="Teach me the essential question words in Tagalog and English">❓ Question words</button>
          <button type="button" class="sug-btn" data-prompt="Teach me how to order food and dining phrases in Tagalog and English">🍽️ Ordering food</button>
          <button type="button" class="sug-btn" data-prompt="Teach me commuting phrases for riding jeepneys, taxis, and buses">🚌 Commuting phrases</button>
          <button type="button" class="sug-btn" data-prompt="Teach me natural Taglish particles like naman, pala, daw, and ba">💬 Taglish particles</button>
          <button type="button" class="sug-btn" data-prompt="Teach me common Filipinisms and how to say them in natural English">✨ Polish Filipinisms</button>
          <button type="button" class="sug-btn" data-prompt="Teach me Taglish verb conjugation with mag-, nag-, and na-">🔄 Taglish verb prefixes</button>
          <button type="button" class="sug-btn" data-prompt="Teach me time and frequency words like palagi, madalas, and minsan">⏰ Time &amp; frequency</button>
          <button type="button" class="sug-btn" data-prompt="Teach me how to compare things using mas, pinaka, and kasing">⚖️ Comparing things</button>
          <button type="button" class="sug-btn" data-prompt="Teach me phrases for giving opinions and disagreeing politely">🗣️ Giving opinions</button>
          <button type="button" class="sug-btn" data-prompt="Teach me famous Filipino and English idioms like balat-sibuyas and under the weather">🎭 Idioms &amp; slang</button>
          <button type="button" class="sug-btn" data-prompt="Teach me how to count, tell time, and pay with numbers in Tagalog and English">💵 Numbers &amp; money</button>
          <button type="button" class="sug-btn" data-prompt="Teach me greetings and farewells from morning to evening">👋 Daily greetings</button>
          <button type="button" class="sug-btn" data-prompt="Teach me words for physical feelings, hunger, fatigue, and health">🤒 Feelings &amp; health</button>
          <button type="button" class="sug-btn" data-prompt="Teach me family and relationship words in Tagalog and English">👨‍👩‍👧 Family terms</button>
          <button type="button" class="sug-btn" data-prompt="Teach me how to talk about the weather, rain, heat, and storms">🌤️ Weather &amp; rain</button>
          <button type="button" class="sug-btn" data-prompt="Teach me house rooms and daily chore phrases like maghugas and magwalis">🏠 Home &amp; chores</button>
          <button type="button" class="sug-btn" data-prompt="Teach me emergency and urgent safety phrases in Tagalog and English">🚨 Emergency phrases</button>
          <button type="button" class="sug-btn" data-prompt="Teach me workplace vocabulary like sahod, overtime, deadlines, and leave">💼 Workplace &amp; office</button>
        </div>
        <button type="button" class="sug-nav-btn next" id="sug-next" aria-label="Scroll topics right" title="Scroll right">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
    <form id="form">
      <textarea id="text" placeholder="Type in English, Tagalog, or Taglish to practice..." autocomplete="off" aria-label="Message" maxlength="2000" rows="1"></textarea>
      <button class="send" id="send" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
    <div class="note">Practice English or Filipino conversation • Gentle corrections &amp; natural feedback</div>
  </div>
</div>

<script>
const HELLO = "Kumusta! Welcome to Kuwentuhan Taglish Tutor. I'm here to help you practice English or Filipino through natural conversation, and I'll gently share tips whenever there's something to improve. What language would you like to practice today?";
const LS = "kuwentuhan.v4";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
let S = { mode: "auto", session: uid(), history: [] }, busy = false;
try {
  const d = JSON.parse(localStorage.getItem(LS));
  if (d && Array.isArray(d.history)) S = { mode: d.mode || "auto", session: d.session || uid(), history: d.history };
} catch {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch {} };
const log = document.getElementById("log"), box = document.getElementById("text"), send = document.getElementById("send");

function formatMsg(text) {
  if (!text) return "";
  let s = String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

  const inline = (str) => {
    return str
      .replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, "<em>$1</em>")
      .replace(/`([^`\n]+)`/g, '<code class="chat-code">$1</code>');
  };

  // 1. Markdown Tables into UI comparison boxes (supports rows with or without outer pipes)
  s = s.replace(/(?:^|\n)((?:[^\n|]*\|[^\n]+\r?\n?)+)(?=\n|$)/g, (match, tableText) => {
    const lines = tableText.trim().split("\n").map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) return match;
    const isSep = (l) => /^\|?(?:\s*:?-+:?\s*\|)+\s*:?-+:?\s*\|?$/.test(l);
    let sepIdx = -1, headerIdx = -1;
    for (let i = 0; i < lines.length - 1; i++) {
      if (isSep(lines[i + 1])) {
        headerIdx = i; sepIdx = i + 1; break;
      }
    }
    if (sepIdx === -1) return match;

    const parseRow = (line) => {
      let l = line.trim();
      if (l.startsWith("|")) l = l.slice(1);
      if (l.endsWith("|")) l = l.slice(0, -1);
      return l.split("|").map(c => c.trim());
    };

    const headers = parseRow(lines[headerIdx]);
    const colCount = Math.max(headers.length, 1);
    let html = '<div class="table-card"><table class="chat-table"><thead><tr>';
    headers.forEach(h => {
      html += `<th>${inline(h)}</th>`;
    });
    html += '</tr></thead><tbody>';

    for (let i = sepIdx + 1; i < lines.length; i++) {
      const row = lines[i];
      if (row.indexOf("|") === -1) continue;
      const cells = parseRow(row);
      while (cells.length < colCount) {
        cells.push("");
      }
      const finalCells = cells.slice(0, colCount);
      html += '<tr>';
      finalCells.forEach((c, idx) => {
        const cls = idx === 0 ? ' class="col-lead"' : '';
        const content = c.length > 0 ? inline(c) : '<span class="empty-dash">—</span>';
        html += `<td${cls}>${content}</td>`;
      });
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
  });

  // 2. Blockquotes (> and &gt;) into boxed cards
  s = s.replace(/(?:^|\n)((?:(?:&gt;|>)[^\n]*(?:\r?\n|$))+)/g, (_, block) => {
    const lines = block.split("\n").map(l => l.replace(/^(?:&gt;|>)\s?/, "").trim()).filter(Boolean);
    if (!lines.length) return "";
    const inner = lines.map(l => inline(l)).join("<br>");
    return `<div class="chat-card quote-card">${inner}</div>`;
  });

  // 3. Section Headers (## and ###)
  s = s.replace(/^###\s+([^\n]+)$/gm, (_, title) => `<h3 class="chat-h3">${inline(title)}</h3>`);
  s = s.replace(/^##\s+([^\n]+)$/gm, (_, title) => `<h2 class="chat-h2">${inline(title)}</h2>`);

  // 4. Horizontal Rules (---)
  s = s.replace(/(?:^|\n)\s*---\s*(?=\n|$)/g, '<hr class="chat-hr">');

  // 5. Callout Cards (Tips, Prompts, Challenges)
  s = s.replace(/(?:^|\n)((?:💡|✨|👉|💬|🎯|🌟|📝)\s+[^\n]+(?:\n(?!(?:💡|✨|👉|💬|🎯|🌟|📝|\n|#|<div|<h|<hr|\|))[^\n]+)*)/g, (_, card) => {
    return `<div class="chat-card">${inline(card.trim()).replace(/\n/g, "<br>")}</div>`;
  });

  // 6. Remaining inline markdown
  s = inline(s);

  // 7. Clean paragraph linebreaks
  s = s.replace(/\n{2,}/g, "<br><br>").replace(/(?<!>)\n(?!<)/g, "<br>");

  // 8. Remove extraneous <br> adjacent to block elements
  s = s.replace(/(?:<br>\s*)+(<(?:div|table|h2|h3|hr))/g, "$1");
  s = s.replace(/(<\/(?:div|table|h2|h3)>|<hr[^>]*>)(?:\s*<br>)+/g, "$1");
  s = s.replace(/^(?:<br>\s*)+|(?:<br>\s*)+$/g, "");

  return s;
}

function bubble(role, text, idx) {
  const entry = idx !== undefined ? S.history[idx] : null;
  const w = document.createElement("div"); w.className = "wrap " + role;
  const s = document.createElement("div"); s.className = "sender"; s.textContent = role === "me" ? "You" : "Taglish Tutor"; w.appendChild(s);
  const m = document.createElement("div"); m.className = "msg"; m.innerHTML = formatMsg(text); w.appendChild(m);
  if (idx !== undefined) addToolbar(w, m, role, idx, entry);
  log.appendChild(w); log.scrollTop = log.scrollHeight;
  return { w, m };
}

function addToolbar(w, m, role, idx, entry) {
  const old = w.querySelector(".toolbar");
  if (old) old.remove();
  const bar = document.createElement("div");
  bar.className = "toolbar";

  // Copy button
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "act-btn";
  copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>`;
  copyBtn.onclick = async () => {
    try {
      const raw = S.history[idx]?.content || m.innerText;
      await navigator.clipboard.writeText(raw.replace(/\*\*/g, ""));
      copyBtn.classList.add("copied");
      copyBtn.querySelector("span").textContent = "Copied!";
      setTimeout(() => {
        copyBtn.classList.remove("copied");
        copyBtn.querySelector("span").textContent = "Copy";
      }, 1400);
    } catch {}
  };
  bar.appendChild(copyBtn);

  // Edit & Delete ONLY on User's messages (never on Kuwentuhan's reply)
  if (role === "me") {
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "act-btn";
    editBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Edit</span>`;
    editBtn.onclick = () => openEditor(w, m, idx);
    bar.appendChild(editBtn);

    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "act-btn del";
    delBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Delete</span>`;
    delBtn.onclick = async () => {
      if (busy) return;
      const item = S.history[idx];
      if (item && item.id) {
        try { await fetch(`/chat/${item.id}`, { method: "DELETE" }); } catch {}
      }
      // Remove the user's message and its paired Kuwentuhan reply right after it
      const removeCount = (S.history[idx + 1] && S.history[idx + 1].role === "assistant") ? 2 : 1;
      S.history.splice(idx, removeCount);
      save();
      render();
    };
    bar.appendChild(delBtn);
  }

  // Thumbs up/down rating on Kuwentuhan's replies
  if (role === "bot" && entry && entry.id) {
    [[1, "👍", "Good answer"], [-1, "👎", "Bad answer"]].forEach(([v, ic, label]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "act-btn";
      b.textContent = ic;
      b.title = label;
      b.setAttribute("aria-pressed", entry.rated === v);
      b.onclick = async () => {
        bar.querySelectorAll("[title='Good answer'],[title='Bad answer']").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        entry.rated = v;
        save();
        try { await fetch("/rate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: entry.id, value: v }) }); } catch {}
      };
      bar.appendChild(b);
    });
  }

  w.appendChild(bar);
}

function openEditor(w, m, idx) {
  if (busy || m.querySelector(".edit-box")) return;
  const current = S.history[idx]?.content || m.textContent;
  m.textContent = "";
  const boxWrap = document.createElement("div");
  boxWrap.className = "edit-box";

  const area = document.createElement("textarea");
  area.className = "edit-area";
  area.value = current;
  boxWrap.appendChild(area);

  const actions = document.createElement("div");
  actions.className = "edit-actions";

  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.className = "edit-cancel";
  cancel.textContent = "Cancel";
  cancel.onclick = () => { m.innerHTML = formatMsg(current); };
  actions.appendChild(cancel);

  const resend = document.createElement("button");
  resend.type = "button";
  resend.className = "edit-resend";
  resend.textContent = "Save & Send";
  resend.onclick = async () => {
    const val = area.value.trim();
    if (!val || busy) return;
    S.history = S.history.slice(0, idx);
    save();
    render();
    await ask(val);
  };
  actions.appendChild(resend);

  boxWrap.appendChild(actions);
  m.appendChild(boxWrap);
  area.focus();
  area.setSelectionRange(area.value.length, area.value.length);
}

function render() {
  log.innerHTML = "";
  bubble("bot", HELLO);
  S.history.forEach((h, i) => bubble(h.role === "user" ? "me" : "bot", h.content, i));
}

function setBusy(val) {
  busy = val;
  send.disabled = val;
  document.querySelectorAll(".sug-btn").forEach(b => { b.disabled = val; });
}

function updateModeUI(mode) {
  const badge = document.querySelector(".badge");
  const status = document.querySelector(".status");
  const input = document.getElementById("text");
  if (!badge || !status || !input) return;

  const sugBtns = document.querySelectorAll(".sug-btn");
  sugBtns.forEach(b => b.classList.remove("primary"));

  if (mode === "fil") {
    badge.textContent = "Filipino Mode";
    status.innerHTML = '<span class="status-dot"></span>Practicing Filipino (Tagalog) • Gentle grammar &amp; affix tips';
    input.placeholder = "Type your message in Filipino (Tagalog)...";
    const filBtn = document.querySelector('.sug-btn[data-prompt*="Tagalog basics"]');
    if (filBtn) filBtn.classList.add("primary");
  } else if (mode === "en") {
    badge.textContent = "English Mode";
    status.innerHTML = '<span class="status-dot"></span>Practicing English • Gentle grammar &amp; phrasing tips';
    input.placeholder = "Type your message in English...";
    const enBtn = document.querySelector('.sug-btn[data-prompt*="English basics"]');
    if (enBtn) enBtn.classList.add("primary");
  } else if (mode === "both") {
    badge.textContent = "Taglish Mode";
    status.innerHTML = '<span class="status-dot"></span>Practicing Taglish • Code-switching &amp; conversational fluency';
    input.placeholder = "Type in English, Tagalog, or Taglish...";
    const bothBtn = document.querySelector('.sug-btn[data-prompt*="Teach me the basics"]');
    if (bothBtn) bothBtn.classList.add("primary");
  } else {
    badge.textContent = "Taglish Tutor";
    status.innerHTML = '<span class="status-dot"></span>Practice English &amp; Filipino with gentle corrections';
    input.placeholder = "Type in English, Tagalog, or Taglish to practice...";
    const defBtn = document.querySelector('.sug-btn[data-prompt*="Teach me the basics"]');
    if (defBtn) defBtn.classList.add("primary");
  }
}

function reset() {
  S = { mode: "auto", session: uid(), history: [] };
  save();
  render();
  updateModeUI("auto");
  box.focus();
}

async function ask(text) {
  if (busy || !text.trim()) return;
  setBusy(true);
  const userIdx = S.history.push({ role: "user", content: text }) - 1;
  save();
  bubble("me", text, userIdx);
  const out = bubble("bot", ""); out.m.classList.add("dots"); let reply = "", id = null;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: S.mode || "auto", session: S.session, messages: S.history.map(({ role, content }) => ({ role, content })) })
    });
    if (res.status === 429) throw new Error("rate");
    if (!res.ok) throw new Error("http");
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "", failed = false;
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n"); buf = parts.pop();
      for (const p of parts) {
        const ev = (p.match(/^event: (\w+)/) || [])[1];
        const data = p.split("\n").find(l => l.startsWith("data: "))?.slice(6);
        if (!data || data === "[DONE]") continue;
        const val = JSON.parse(data);
        if (ev === "meta") {
          id = val.id;
          if (val.mode) {
            S.mode = val.mode;
            updateModeUI(val.mode);
            save();
          }
          if (id && S.history[userIdx]) S.history[userIdx].id = id;
          continue;
        }
        if (ev === "error") { failed = true; out.m.classList.add("err"); reply = val; } else reply += val;
        out.m.classList.remove("dots"); out.m.innerHTML = formatMsg(reply); log.scrollTop = log.scrollHeight;
      }
    }
    if (!reply) throw new Error("empty");
    if (failed) S.history.pop();
    else {
      const botIdx = S.history.push({ role: "assistant", content: reply, id }) - 1;
      addToolbar(out.w, out.m, "bot", botIdx, S.history[botIdx]);
    }
  } catch (e) {
    out.m.classList.remove("dots"); out.m.classList.add("err");
    out.m.textContent = e.message === "rate" ? "Too many messages. Please wait a moment." : "Can't reach the server. Check that it's running.";
    S.history.pop();
  }
  save(); setBusy(false); box.focus();
}

const sugList = document.getElementById("sug-list");
const sugPrev = document.getElementById("sug-prev");
const sugNext = document.getElementById("sug-next");

function updateScrollButtons() {
  if (!sugList) return;
  const maxScroll = sugList.scrollWidth - sugList.clientWidth - 2;
  if (sugPrev) sugPrev.disabled = sugList.scrollLeft <= 4;
  if (sugNext) sugNext.disabled = sugList.scrollLeft >= maxScroll;
}

if (sugList) {
  if (sugPrev) sugPrev.onclick = () => sugList.scrollBy({ left: -260, behavior: "smooth" });
  if (sugNext) sugNext.onclick = () => sugList.scrollBy({ left: 260, behavior: "smooth" });
  sugList.addEventListener("scroll", updateScrollButtons, { passive: true });
  window.addEventListener("resize", updateScrollButtons, { passive: true });
  setTimeout(updateScrollButtons, 60);

  // Horizontal wheel scroll
  sugList.addEventListener("wheel", e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      sugList.scrollLeft += e.deltaY;
    }
  }, { passive: false });

  // Mouse drag support for smooth dragging
  let isDown = false, startX = 0, scrollStart = 0, moved = false;
  sugList.addEventListener("mousedown", e => {
    isDown = true;
    moved = false;
    sugList.classList.add("dragging");
    startX = e.pageX - sugList.offsetLeft;
    scrollStart = sugList.scrollLeft;
  });
  window.addEventListener("mouseup", () => {
    if (!isDown) return;
    isDown = false;
    sugList.classList.remove("dragging");
  });
  sugList.addEventListener("mousemove", e => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - sugList.offsetLeft;
    const walk = (x - startX) * 1.4;
    if (Math.abs(walk) > 4) moved = true;
    sugList.scrollLeft = scrollStart - walk;
  });

  // Click delegation
  sugList.addEventListener("click", e => {
    if (moved) {
      moved = false;
      return;
    }
    const btn = e.target.closest(".sug-btn");
    if (!btn || busy) return;
    const prompt = btn.getAttribute("data-prompt");
    if (prompt) {
      box.value = "";
      ask(prompt);
    }
  });
}

function autoResizeBox() {
  box.style.height = "auto";
  const newH = Math.min(box.scrollHeight, 180);
  box.style.height = (newH > 22 ? newH : 22) + "px";
}

box.addEventListener("input", autoResizeBox);
box.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("form").requestSubmit();
  }
});

document.getElementById("form").onsubmit = e => {
  e.preventDefault();
  const t = box.value;
  box.value = "";
  autoResizeBox();
  ask(t);
};
document.getElementById("new").onclick = () => reset();
render();
updateModeUI(S.mode || "auto");

(function initPageLoader() {
  const loader = document.getElementById("page-loader");
  const bar = document.getElementById("load-bar");
  const pctEl = document.getElementById("load-pct");
  const statusEl = document.getElementById("load-status");
  if (!loader) return;

  const DURATION = 2400;
  const start = performance.now();
  let serverOk = false, finished = false;

  fetch("/healthz")
    .then(r => { if (r.ok) serverOk = true; })
    .catch(() => {});

  function dismiss() {
    if (finished) return;
    finished = true;
    loader.classList.add("hide");
    setTimeout(() => {
      loader.remove();
      box.focus();
    }, 750);
  }

  function tick(now) {
    if (finished) return;
    const elapsed = Math.min(now - start, DURATION);
    const t = elapsed / DURATION;
    const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const pct = Math.round(eased * 100);

    if (bar) bar.style.transform = `scaleX(${eased.toFixed(4)})`;
    if (pctEl) pctEl.textContent = pct + "%";
    if (statusEl) {
      if (pct < 35) statusEl.textContent = "Connecting to language engine...";
      else if (pct < 70) statusEl.textContent = serverOk ? "Core online • Loading Taglish tutor..." : "Loading Taglish tutor...";
      else if (pct < 95) statusEl.textContent = "Preparing practice workspace...";
      else statusEl.textContent = "Ready • Entering Kuwentuhan Taglish Tutor...";
    }

    if (elapsed < DURATION) {
      requestAnimationFrame(tick);
    } else {
      dismiss();
    }
  }

  loader.onclick = dismiss;
  requestAnimationFrame(tick);
})();
</script>
